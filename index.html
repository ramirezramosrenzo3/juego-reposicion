<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>Juego de Reposición</title>
  <style>
    :root {
      --azul: #1d4ed8;
      --fondo: #f3f5f9;
      --tarjeta: #ffffff;
      --texto: #111827;
      --gris: #6b7280;
      --borde: #e5e7eb;
      --verde: #15803d;
      --rojo: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      font-size: 16px;
      line-height: 1.4;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    #app { max-width: 720px; margin: 0 auto; padding: 12px; }
    h1 { font-size: 1.5rem; margin: 6px 0 8px; }
    h2 { font-size: 1.15rem; margin: 18px 0 6px; }
    h3 { font-size: 1rem; margin: 14px 0 6px; }
    p { margin: 6px 0; }
    .card {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .ayuda { color: var(--gris); font-size: 0.92rem; }
    .estado { color: var(--gris); font-size: 0.92rem; }
    .aviso { color: var(--rojo); font-weight: 600; min-height: 1.2em; margin: 8px 0 0; }
    label { display: block; margin: 10px 0; font-weight: 600; font-size: 0.95rem; }
    input, select {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cfd4dc;
      border-radius: 10px;
      background: #fff;
    }
    input.link { font-size: 0.85rem; color: var(--gris); }
    .fila { display: flex; gap: 10px; flex-wrap: wrap; }
    .fila > * { flex: 1 1 200px; }
    button {
      width: 100%;
      padding: 13px;
      margin: 10px 0 4px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    button.principal { background: var(--azul); color: #fff; }
    button.principal:disabled { background: #9ca3af; cursor: not-allowed; }
    button.secundario { background: #e5e7eb; color: var(--texto); }
    .barra {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--azul);
      color: #fff;
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .tiempo { font-variant-numeric: tabular-nums; font-weight: 700; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 6px 0; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td {
      padding: 7px 6px;
      border-bottom: 1px solid var(--borde);
      text-align: right;
      vertical-align: top;
    }
    td { white-space: normal; }
    th { color: var(--gris); font-weight: 600; font-size: 0.8rem; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    table.form td input, table.form td select { margin: 0; padding: 8px; }
    table.form td { text-align: left; }
    table.conj td:nth-child(2) { min-width: 130px; }
    table.conj td:nth-child(3) { text-align: left; font-size: 0.85rem; }
    tr.mio td { background: #eff6ff; }
    .pos { color: var(--verde); font-weight: 600; }
    .neg { color: var(--rojo); font-weight: 600; }
    .chip {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }
    .codigo { font-size: 1.6rem; letter-spacing: 4px; color: var(--azul); }
    .lista { padding-left: 18px; }
    .ganador { font-size: 1.2rem; font-weight: 700; }
    .equipo { flex: 1 1 200px; }
    small { color: var(--gris); }

    /* ---- cronómetro fijo ---- */
    .reloj {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: var(--azul); color: #fff;
      padding: calc(8px + env(safe-area-inset-top)) 14px 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .reloj { transform: translateZ(0); -webkit-transform: translateZ(0); contain: layout paint; }
    .reloj[hidden] { display: none; }
    .rl-fila { height: 34px; display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 720px; margin: 0 auto; font-size: .85rem; }
    #cab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
    #rl-seg { font-size: 1.5rem; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 5.2ch; text-align: right; }
    .rl-barra { height: 5px; background: rgba(255,255,255,.3); border-radius: 3px; margin: 5px auto 0; max-width: 720px; overflow: hidden; }
    .rl-barra i { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; }
    .reloj.rojo { background: #dc2626; }
    body.con-reloj { padding-top: calc(62px + env(safe-area-inset-top)); }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 80px); opacity: 0;
      background: #111827; color: #fff; padding: 10px 16px; border-radius: 20px; z-index: 60;
      transition: all .4s; pointer-events: none; font-weight: 600;
    }
    .toast.ver { transform: translate(-50%, 0); opacity: 1; }

    /* ---- avatares ---- */
    .av { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
      width: 48px; height: 48px; border-radius: 50%; background: #e0e7ff; font-size: 1.7rem; line-height: 1; vertical-align: middle; }
    .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .av i { position: absolute; right: -2px; bottom: -2px; background: var(--azul); color: #fff; font-style: normal;
      font-size: .62rem; font-weight: 700; min-width: 17px; height: 17px; line-height: 17px; text-align: center; border-radius: 9px; }
    .av.peq { width: 26px; height: 26px; font-size: 1rem; }
    .av.peq i { font-size: .5rem; min-width: 12px; height: 12px; line-height: 12px; }
    .av.med { width: 44px; height: 44px; }
    .av.grande { width: 110px; height: 110px; font-size: 4rem; }
    .av.grande i { font-size: 1rem; min-width: 28px; height: 28px; line-height: 28px; border-radius: 14px; }
    .grid-av { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .grid-av .av-btn { margin: 0; padding: 6px 0; background: #f3f4f6; border: 2px solid transparent; border-radius: 12px; width: auto; }
    .grid-av .av-btn.sel { border-color: var(--azul); background: #dbeafe; }
    .perfil { text-align: center; margin-top: 10px; }
    .perfil[hidden], #pide-av[hidden] { display: none; }
    .perfil label { text-align: left; }
    .sin-punto { list-style: none; padding-left: 0; }
    .sin-punto li { margin: 6px 0; }

    /* ---- elección de puesto ---- */
    .dos-col { display: flex; gap: 10px; flex-wrap: wrap; }
    .colEq { flex: 1 1 250px; border: 2px solid var(--borde); border-radius: 12px; padding: 8px; }
    .colEq.miEq { border-color: var(--azul); background: #eff6ff; }
    .slot { padding: 8px; border-bottom: 1px solid var(--borde); }
    .slot:last-child { border-bottom: none; }
    .slot.mio { background: #dbeafe; border-radius: 8px; }
    .slot.ocup { color: var(--gris); }
    .rolnom { display: block; font-weight: 700; margin-bottom: 4px; color: var(--texto); }
    button.mini { width: auto; padding: 8px 12px; margin: 2px 0; font-size: .9rem; background: var(--azul); color: #fff; }
    button.mini.sec { background: #e5e7eb; color: var(--texto); }

    /* ---- dinero ---- */
    .dinero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .dinero .gran { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    details.reglas summary { cursor: pointer; font-weight: 600; color: var(--azul); }
    .estim { background: #fefce8; border: 1px solid #fde68a; border-radius: 10px; padding: 8px 10px; font-size: .92rem; }
    .estim:empty { display: none; }

    /* ---- cadena con camiones ---- */
    .cadena { padding: 4px 0; }
    .nodo { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 2px solid var(--borde); border-radius: 12px; background: #fff; min-height: 44px; }
    .nodo.mio { border-color: var(--azul); background: #eff6ff; }
    .nodo .ic { font-size: 1.6rem; }
    .nodo .ni { line-height: 1.3; font-size: .92rem; }
    .tu { background: var(--azul); color: #fff; border-radius: 8px; padding: 0 6px; font-size: .7rem; font-weight: 700; }
    .lane { position: relative; height: 80px; margin-left: 34px; border-left: 3px dashed #94a3b8; }
    .lane.fija { height: 30px; display: flex; align-items: center; padding-left: 12px; font-size: .85rem; color: var(--gris); }
    .camion { position: absolute; left: -17px; transform: translateY(-50%); display: flex; align-items: center; gap: 8px;
      white-space: nowrap; transition: top 1.2s ease-in-out, opacity 1s; }
    .camion .cm { font-size: 1.7rem; display: inline-block; }
    .camion small { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 1px 6px; color: var(--texto); }

    /* ---- pantalla final ---- */
    .equipo { border: 2px solid var(--borde); border-radius: 12px; padding: 10px; }
    .equipo.gana { border-color: #eab308; background: #fefce8; }
    .int { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    @media (max-width: 480px) {
      table { font-size: 0.8rem; }
      th, td { padding: 6px 4px; }
      th { font-size: 0.72rem; white-space: normal; }
    }
  </style>
</head>
<body>
  <!-- Cronómetro fijo: siempre visible aunque se haga scroll -->
  <div id="reloj" class="reloj" hidden>
    <div class="rl-fila"><span id="cab"></span><b id="rl-seg"></b></div>
    <div class="rl-barra"><i id="rl-prog"></i></div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="app"></div>

  <!-- Supabase (base de datos y tiempo real) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Configuración: URL y clave de tu proyecto de Supabase -->
  <script src="config.js"></script>
  <!-- Los 20 avatares -->
  <script src="avatares.js"></script>
  <!-- Reglas del juego -->
  <script src="game.js"></script>
  <!-- Pantallas y conexión -->
  <script src="app.js"></script>
</body>
</html>
